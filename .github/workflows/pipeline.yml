name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # --- Validate ---
      - name: Check required files
        run: |
          for f in manifest.json content.js styles.css; do
            test -f "$f" || { echo "Missing: $f"; exit 1; }
            echo "  ✓ $f"
          done

      - name: Validate manifest.json
        run: |
          node -e "
            const manifest = JSON.parse(require('fs').readFileSync('manifest.json','utf8'));
            const required = ['manifest_version','name','version','permissions','content_scripts'];
            const missing = required.filter(k => !(k in manifest));
            if (missing.length) { console.error('Missing:', missing); process.exit(1); }
            if (manifest.manifest_version !== 3) { console.error('Expected MV3'); process.exit(1); }
            console.log('✓ manifest.json valid —', manifest.name, 'v' + manifest.version);
          "

      - name: Check for Chrome-reserved directory names
        run: |
          reserved=$(find . -maxdepth 1 -type d -name '_*' \
            ! -name '_locales' ! -name '_metadata' ! -name '.' | head -20)
          if [ -n "$reserved" ]; then
            echo "::error::Chrome-reserved directory names found:"
            echo "$reserved"
            echo "Rename these directories — Chrome will refuse to install the extension."
            exit 1
          fi
          echo "  ✓ No reserved directory names"

      - name: Validate JS syntax
        run: node --check content.js

      # --- Lint ---
      - name: ESLint
        run: npm run lint

      # --- Test ---
      - name: Jest
        run: npm test
