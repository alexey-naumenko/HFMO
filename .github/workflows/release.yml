name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  ci:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Jest
        run: npm test

  build-and-release:
    name: Build & Release
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build extension ZIP
        run: |
          mkdir -p dist
          zip -r dist/huntflow-menu-organizer.zip \
            manifest.json content.js styles.css LICENSE \
            -x "*.git*" "*.github*" "example.html" "*.md" "dist/*" \
               "node_modules/*" "package*.json" "tests/*" "eslint.config.js" "coverage/*"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: huntflow-menu-organizer
          path: dist/huntflow-menu-organizer.zip

      - name: Semantic Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
